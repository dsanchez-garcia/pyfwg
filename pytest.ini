[pytest]
testpaths = tests
markers =
    integration: checks local FWG distribution JARs (set FWG_JAR_DIR or --fwg-jar-dir)
    java: starts Java to check the CLI of a local JAR
    morphing: generates weather with a real regional EPW (requires --fwg-epw-dir)
    interfaces: checks API, workflow, DataFrame and XLSX routes with installed JARs
